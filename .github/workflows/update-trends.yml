name: 🔄 자동 트렌드 분석 업데이트

on:
  # 매일 실행 (UTC 기준 00:00 = 한국시간 09:00)
  schedule:
    - cron: '0 0 * * *'
  
  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      run_naver:
        description: '🆕 네이버 트렌드 수집 (추천)'
        type: boolean
        default: true
      run_recent:
        description: '최근 7일 Google 데이터 수집'
        type: boolean
        default: false
      run_full:
        description: '전체 트렌드 분석 실행'
        type: boolean
        default: false

env:
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  update-trends:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 의존성 설치
        run: npm ci

      - name: 🆕 네이버 데이터랩 트렌드 수집 (메인)
        if: ${{ github.event.inputs.run_naver != 'false' }}
        run: |
          echo "🚀 네이버 데이터랩 트렌드 수집 시작..."
          npx ts-node scripts/collectNaverTrends.ts
        continue-on-error: true

      - name: 🗺️ Google 최근 7일 지역별 트렌드 수집 (보조)
        if: ${{ github.event.inputs.run_recent == 'true' }}
        run: |
          echo "🚀 Google 최근 7일 지역별 트렌드 데이터 수집 시작..."
          npx ts-node scripts/collectRecentTrends.ts || echo "⚠️ 최근 데이터 수집 실패 (Rate limit일 수 있음)"
        continue-on-error: true

      - name: 🔬 전체 트렌드 분석 실행 (월 1회 권장)
        if: ${{ github.event.inputs.run_full == 'true' }}
        run: |
          echo "🚀 전체 구글 트렌드 데이터 수집 시작..."
          npx ts-node scripts/analyzeTrends.ts || echo "⚠️ 분석 스크립트 실패 (Rate limit일 수 있음)"
        continue-on-error: true

      - name: 📊 분석 결과 확인
        run: |
          echo "=== 📊 데이터 수집 결과 ==="
          echo ""
          echo "🆕 네이버 데이터: Supabase DB에 저장됨"
          echo ""
          
          echo "=== 최근 7일 Google 데이터 ==="
          if [ -f src/data/recent-regional-trends.json ]; then
            echo "✅ recent-regional-trends.json 생성됨"
            echo "📅 생성 시간: $(cat src/data/recent-regional-trends.json | jq -r '.generatedAt')"
          else
            echo "⚠️ recent-regional-trends.json 파일 없음"
          fi
          
          echo ""
          echo "=== 전체 트렌드 데이터 ==="
          if [ -f src/data/trend-analysis.json ]; then
            echo "✅ trend-analysis.json 존재"
          else
            echo "⚠️ trend-analysis.json 파일 없음"
          fi

      - name: 💾 변경사항 커밋 & 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 변경된 파일이 있는지 확인
          if git diff --quiet src/data/; then
            echo "📭 변경사항 없음 (네이버 데이터는 Supabase에 저장됨)"
          else
            git add src/data/
            git commit -m "🔄 트렌드 데이터 자동 업데이트 ($(date +'%Y-%m-%d'))"
            git push
            echo "✅ 커밋 완료!"
          fi

      - name: 🔔 완료 알림
        run: |
          echo "=========================================="
          echo "🎉 트렌드 분석 자동 업데이트 완료!"
          echo "=========================================="
          echo ""
          echo "📅 실행 시간: $(TZ='Asia/Seoul' date)"
          echo "🔗 다음 실행: 내일 09:00 (KST)"
          echo ""
          echo "📊 데이터 소스:"
          echo "  - 네이버 데이터랩 → Supabase DB"
          echo "  - Google Trends → JSON 파일 (보조)"
